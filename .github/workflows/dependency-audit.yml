name: Dependency Security Audit

on:
  push:
    branches: [main]
    paths:
      - "requirements.txt"
      - ".github/workflows/dependency-audit.yml"
  pull_request:
    paths:
      - "requirements.txt"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency auditor
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit web dependencies
        run: pip-audit -r requirements.txt
